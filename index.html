<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Mystic Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👁️ Arcane Pitch Forecaster 👁️</h1>
            <p>Decoding the threads of fate through ancient systems.</p>
        </header>

        <main>
            <div class="teams-container">
                <div class="team-input">
                    <label for="teamA">Home Team Name:</label>
                    <input type="text" id="teamA" placeholder="e.g., Arsenal">
                    <label for="dateA">Exact Founding Date:</label>
                    <input type="date" id="dateA">
                </div>
                
                <div class="team-input">
                    <label for="teamB">Away Team Name:</label>
                    <input type="text" id="teamB" placeholder="e.g., Chelsea">
                    <label for="dateB">Exact Founding Date:</label>
                    <input type="date" id="dateB">
                </div>
            </div>

            <div class="match-details">
                <label for="matchDate">Date of the Fixture:</label>
                <input type="date" id="matchDate">
            </div>

            <div class="action-buttons">
                <button id="castBtn">Cast the Runes & Read the Stars</button>
                <button id="resetBtn" class="reset-btn">Purge the Altar (Reset)</button>
            </div>

            <div id="loader" class="hidden">
                <div class="mystic-spinner">👁️</div>
                <p class="loading-text">Consulting the ancient scrolls...</p>
            </div>

            <div id="results" class="hidden">
                <div class="oracle-card">
                    <h3>🔢 Chaldean Numerology</h3>
                    <p id="numOutput"></p>
                </div>
                <div class="oracle-card">
                    <h3>🌕 Astrological & Elemental Alignment</h3>
                    <p id="astroOutput"></p>
                </div>
                <div class="oracle-card">
                    <h3>☯️ I Ching (Book of Changes)</h3>
                    <p id="ichingOutput"></p>
                </div>
                <div class="verdict-card">
                    <h3>🏆 The Prophesied Victor: <span id="finalVerdict"></span></h3>
                </div>
                
                <button id="copyBtn" class="secondary-btn">📋 Copy Prophecy to Clipboard</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
