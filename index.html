<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Pitch Forecaster | Esoteric Football Predictions</title>
    
    <meta name="title" content="Arcane Pitch Forecaster">
    <meta name="description" content="Predicting football match outcomes through deterministic algorithms, Chaldean numerology, and the I Ching.">
    <meta name="author" content="Kiru">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-orb top-left"></div>
    <div class="glow-orb bottom-right"></div>
    
    <div class="container glass-panel">
        <header>
            <h1>🔮 Arcane Forecaster</h1>
            <p>Decoding the pitch through the 9 Pillars of esoteric alignment.</p>
        </header>

        <main>
            <div class="teams-container">
                <div class="team-input">
                    <label>Home Team</label>
                    <input type="text" id="teamA" placeholder="e.g., Arsenal">

                    <label>Club Founding</label>
                    <input type="date" id="dateA">

                    <label>Manager Birth</label>
                    <input type="date" id="managerA">

                    <label>Captain Birth</label>
                    <input type="date" id="captainA">

                    <label>Kit Color</label>
                    <select id="colorA">
                        <option value="Red">Red / Crimson</option>
                        <option value="Blue">Blue / Navy</option>
                        <option value="White">White / Silver</option>
                        <option value="Black">Black / Grey</option>
                        <option value="Yellow">Yellow / Gold</option>
                        <option value="Green">Green</option>
                        <option value="Pink" selected>Pink / Magenta</option>
                    </select>
                </div>

                <div class="team-input">
                    <label>Away Team</label>
                    <input type="text" id="teamB" placeholder="e.g., Chelsea">

                    <label>Club Founding</label>
                    <input type="date" id="dateB">

                    <label>Manager Birth</label>
                    <input type="date" id="managerB">

                    <label>Captain Birth</label>
                    <input type="date" id="captainB">

                    <label>Kit Color</label>
                    <select id="colorB">
                        <option value="Red">Red / Crimson</option>
                        <option value="Blue" selected>Blue / Navy</option>
                        <option value="White">White / Silver</option>
                        <option value="Black">Black / Grey</option>
                        <option value="Yellow">Yellow / Gold</option>
                        <option value="Green">Green</option>
                        <option value="Pink">Pink / Magenta</option>
                    </select>
                </div>
            </div>

            <div class="match-details">
                <label>Stadium / Grounds</label>
                <input type="text" id="stadium" placeholder="e.g., Santiago Bernabéu">
                <label>Match Official (Referee)</label>
                <input type="text" id="referee" placeholder="e.g., Anthony Taylor">
                <label>Fixture Date</label>
                <input type="date" id="matchDate">
            </div>

            <div class="action-buttons">
                <button id="castBtn" class="primary-btn">Cast the Runes</button>
                <button id="resetBtn" class="reset-btn">Purge Altar</button>
            </div>

            <div id="loader" class="hidden">
                <div class="mystic-spinner">👁️</div>
                <p class="loading-text">Calculating the 9 Pillars of Fate...</p>
            </div>

            <div id="results" class="hidden">
                <div class="oracle-grid">
                    <div class="oracle-card"><h3>🔢 Twin Numerology</h3><p id="numOutput"></p></div>
                    <div class="oracle-card"><h3>🌕 Club Astrology</h3><p id="astroOutput"></p></div>
                    <div class="oracle-card"><h3>👑 Commander Aura</h3><p id="managerOutput"></p></div>
                    <div class="oracle-card"><h3>🌍 Geomancy</h3><p id="geomancyOutput"></p></div>
                    <div class="oracle-card"><h3>🧬 Captain Biorhythms</h3><p id="bioOutput"></p></div>
                    <div class="oracle-card"><h3>🎨 Chromotherapy</h3><p id="colorOutput"></p></div>
                    <div class="oracle-card"><h3>⚖️ The Judge</h3><p id="refOutput"></p></div>
                    <div class="oracle-card"><h3>🪐 Cosmic Transits</h3><p id="transitOutput"></p></div>
                    <div class="oracle-card full-width"><h3>☯️ I Ching</h3><p id="ichingOutput"></p></div>
                </div>

                <div class="verdict-card">
                    <h3>Prophesied Victor</h3>
                    <div id="finalVerdict" class="victor-name"></div>
                </div>

                <button id="copyBtn" class="secondary-btn">📋 Copy to Clipboard</button>
            </div>
        </main>
    </div>
    <script src="database.js"></script> 
    <script src="script.js"></script>
</body>
</html>
